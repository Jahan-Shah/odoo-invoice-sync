services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports: ["127.0.0.1:5433:5432"]  # localhost only (for DB tools)
    volumes:
      - db-data:/var/lib/postgresql/data
  odoo:
    image: odoo:18.0
    depends_on: [db]
    ports: ["8069:8069"]
    command: ["--db-filter=^odoo_dev$"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
volumes:
  db-data:
  odoo-data:
